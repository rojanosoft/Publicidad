<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base id="basePathTag" href="/">
    <title>Admin - Sistema de Publicidad</title>
    <script>window.BASE_PATH = window.BASE_PATH || '/';</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: white;
            transform: translateY(-2px);
        }

        button {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .error-message {
            color: #c62828;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-radius: 10px;
            border-left: 5px solid #f44336;
            display: none;
            animation: shake 0.5s ease, slideIn 0.4s ease;
            box-shadow: 0 3px 15px rgba(244, 67, 54, 0.2);
            font-weight: 500;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Admin Panel Styles */
        .admin-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 40px;
            max-width: 1400px;
            width: 100%;
            display: none;
            animation: fadeInUp 0.6s ease;
        }

        .admin-container.show {
            display: block;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, #667eea, #764ba2) 1;
            padding-bottom: 25px;
        }

        .admin-header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%) !important;
            padding: 12px 28px !important;
            width: auto !important;
            font-size: 14px !important;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3) !important;
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #ee5a6f 0%, #d32f2f 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5) !important;
        }

        .admin-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        .sidebar {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8ebff 100%);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.15);
            padding: 24px;
            height: fit-content;
            position: sticky;
            top: 20px;
            border: 1px solid rgba(102, 126, 234, 0.1);
        }

        .sidebar h3 {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 18px;
            margin-top: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .main-sections {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .section {
            padding: 30px;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            font-size: 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, #667eea, #764ba2, transparent) 1;
            padding-bottom: 12px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="file"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input[type="file"] {
            padding: 12px;
            cursor: pointer;
        }

        input[type="file"]:hover,
        select:hover {
            border-color: #667eea;
            background: white;
        }

        input[type="text"]:focus,
        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: white;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .button-group button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }

        .success-message {
            color: #2e7d32;
            font-size: 14px;
            margin-top: 15px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 10px;
            border-left: 5px solid #4caf50;
            display: none;
            animation: slideIn 0.4s ease;
            box-shadow: 0 3px 15px rgba(76, 175, 80, 0.2);
            font-weight: 500;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .folders-list {
            background: white;
            border: 2px solid rgba(102, 126, 234, 0.1);
            border-radius: 12px;
            padding: 0;
            max-height: 600px;
            overflow-y: auto;
            list-style: none;
            overflow-x: hidden;
        }

        .folders-list::-webkit-scrollbar {
            width: 8px;
        }

        .folders-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .folders-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        .folder-item {
            padding: 16px 14px;
            background: white;
            border-bottom: 1px solid rgba(102, 126, 234, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .folder-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .folder-item:hover {
            background: linear-gradient(90deg, #f0f4ff 0%, #e8ebff 100%);
            padding-left: 18px;
        }

        .folder-item:hover::before {
            transform: translateX(0);
        }

        .folder-item.active {
            background: linear-gradient(90deg, #e3f2fd 0%, #d6e4ff 100%);
            border-left: 5px solid #667eea;
            padding-left: 12px;
            box-shadow: inset 0 0 0 1px rgba(102, 126, 234, 0.2);
        }

        .folder-item span {
            color: #333;
            font-weight: 600;
            flex: 1;
            font-size: 15px;
        }

        .folder-item button {
            padding: 4px 8px;
            font-size: 11px;
            background: #f44336;
            margin-left: 5px;
            width: auto;
        }

        .files-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 2px solid rgba(102, 126, 234, 0.1);
        }

        .files-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .files-table th,
        .files-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(102, 126, 234, 0.08);
        }

        .files-table th {
            font-weight: 700;
            color: white;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .files-table tbody tr {
            transition: all 0.3s ease;
        }

        .files-table tbody tr:hover {
            background: linear-gradient(90deg, #f8f9ff 0%, #e8ebff 100%);
            transform: scale(1.01);
        }

        .files-table tbody tr:last-child td {
            border-bottom: none;
        }

        .file-size {
            color: #666;
            font-size: 12px;
        }

        /* Media Cards Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .media-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid rgba(102, 126, 234, 0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .media-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .media-card-thumbnail {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8ebff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .media-card-thumbnail img,
        .media-card-thumbnail video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-card-thumbnail.video-placeholder {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-size: 48px;
        }

        .media-card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .media-card-name {
            font-weight: 600;
            color: #333;
            font-size: 13px;
            word-break: break-word;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .media-card-size {
            color: #999;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .media-card-type {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 4px;
            margin-bottom: 8px;
            width: fit-content;
        }

        .media-card-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
        }

        .media-card-btn {
            flex: 1;
            padding: 6px 8px !important;
            font-size: 11px !important;
            border-radius: 6px !important;
            transition: all 0.3s ease !important;
            cursor: pointer !important;
        }

        .media-card-delete {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%) !important;
            color: white !important;
            border: none !important;
        }

        .media-card-delete:hover {
            background: linear-gradient(135deg, #ee5a6f 0%, #d32f2f 100%) !important;
            transform: scale(1.05) !important;
            box-shadow: 0 3px 10px rgba(255, 107, 107, 0.4) !important;
        }

        .media-card-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            border: none !important;
        }

        .media-card-download:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%) !important;
            transform: scale(1.05) !important;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4) !important;
        }

        .no-content {
            color: #999;
            padding: 60px 30px;
            text-align: center;
            background: linear-gradient(135deg, #f9f9f9 0%, #f0f4ff 100%);
            border-radius: 16px;
            border: 2px dashed rgba(102, 126, 234, 0.2);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .no-content:hover {
            border-color: rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #f0f4ff 0%, #e8ebff 100%);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%) !important;
            padding: 8px 16px !important;
            font-size: 12px !important;
            width: auto !important;
            border-radius: 8px !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 3px 10px rgba(255, 107, 107, 0.3) !important;
        }

        .btn-delete:hover {
            background: linear-gradient(135deg, #ee5a6f 0%, #d32f2f 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.5) !important;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }

        @media (max-width: 1024px) {
            .admin-content {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .admin-content {
                grid-template-columns: 1fr;
            }

            .login-container {
                padding: 30px 20px;
            }

            .admin-container {
                padding: 20px;
            }

            .sidebar {
                position: static;
            }
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin-right: 10px;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        @keyframes spin {
            0% { 
                transform: rotate(0deg);
            }
            100% { 
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <h1>🔐 Admin</h1>
            <p>Sistema de Publicidad</p>
        </div>
        <div class="error-message" id="loginError"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="•••••••">
            </div>
            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <h1>📊 Panel de Administración</h1>
            <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
        </div>

        <div class="admin-content">
            <!-- Sidebar - Folders -->
            <div class="sidebar">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3>📁 Carpetas</h3>
                    <button onclick="showCreateFolderForm()" style="width: auto; padding: 6px 12px; font-size: 12px;">+</button>
                </div>
                <!-- Breadcrumb Navigation -->
                <div id="breadcrumb" style="margin-bottom: 10px; padding: 8px; background: white; border-radius: 8px; font-size: 13px; display: none;">
                    <span style="color: #667eea; cursor: pointer;" onclick="navigateToPath('')">🏠 Inicio</span>
                </div>
                <!-- Back Button -->
                <button id="backButton" onclick="navigateBack()" style="width: 100%; margin-bottom: 10px; padding: 8px; font-size: 13px; display: none;">
                    ⬅️ Volver
                </button>
                <div class="folders-list" id="foldersList">
                    Cargando carpetas...
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-sections">
                <!-- Create Folder Section -->
                <div class="section" id="createFolderSection" style="display: none;">
                    <h2>📁 Crear Nueva Carpeta</h2>
                    <form id="createFolderForm">
                        <div class="form-group">
                            <label for="folderName">Nombre de la carpeta</label>
                            <input type="text" id="folderName" required placeholder="ej: promociones">
                            <small id="folderPathHint" style="color: #666; margin-top: 5px; display: block;">
                                Se creará en la ubicación actual
                            </small>
                        </div>
                        <div class="button-group">
                            <button type="submit">Crear Carpeta</button>
                            <button type="button" onclick="hideForms()" style="background: #999;">Cancelar</button>
                        </div>
                        <div class="success-message" id="folderSuccess"></div>
                    </form>
                </div>

                <!-- Upload Section -->
                <div class="section" id="uploadSection" style="display: none;">
                    <h2>📤 Subir Archivo a <span id="uploadFolderName"></span></h2>
                    <form id="uploadForm">
                        <div class="form-group">
                            <label for="fileInput">Selecciona archivo (imagen o video)</label>
                            <input type="file" id="fileInput" required accept="image/*,video/*">
                            <small style="color: #666; margin-top: 5px; display: block;">
                                Formatos: JPG, PNG, GIF, MP4, WebM (Max 5GB)
                            </small>
                        </div>
                        <div class="button-group">
                            <button type="submit">Subir Archivo</button>
                            <button type="button" onclick="hideForms()" style="background: #999;">Cancelar</button>
                        </div>
                        <div class="success-message" id="uploadSuccess"></div>
                    </form>
                </div>

                <!-- Folder Contents Section -->
                <div class="section" id="contentsSection">
                    <h2>📂 Contenido de <span id="currentFolderName">carpeta</span></h2>
                    <div id="folderContents">
                        <div class="no-content">Selecciona una carpeta para ver su contenido</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get BASE_PATH from window, or derive from base tag
        if (typeof window.BASE_PATH === 'undefined') {
            window.BASE_PATH = document.querySelector('base')?.getAttribute('href') || '/';
            if (!window.BASE_PATH.endsWith('/')) {
                window.BASE_PATH += '/';
            }
        }
        
        const API_BASE = window.BASE_PATH === '/' ? '/api' : `${window.BASE_PATH}api`;
        let authToken = localStorage.getItem('adminToken');
        let currentFolder = null;
        let currentPath = ''; // Track current path for subfolder navigation

        // Check if already logged in
        if (authToken) {
            showAdminPanel();
            loadFolders();
        }

        // ============ LOGIN ============
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');

            try {
                errorEl.classList.remove('show');
                const response = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                authToken = data.token;
                localStorage.setItem('adminToken', authToken);
                showAdminPanel();
                loadFolders();
                document.getElementById('loginForm').reset();
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.add('show');
            }
        });

        // ============ LOGOUT ============
        document.getElementById('logoutBtn').addEventListener('click', () => {
            authToken = null;
            currentPath = '';
            localStorage.removeItem('adminToken');
            document.getElementById('adminContainer').classList.remove('show');
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('loginForm').reset();
            hideForms();
        });

        // ============ SHOW/HIDE FORMS ============
        function showCreateFolderForm() {
            const pathInfo = currentPath ? ` en "${currentPath}"` : ' en raíz';
            document.getElementById('createFolderSection').querySelector('h2').textContent = 
                `📁 Crear Nueva Carpeta${pathInfo}`;
            
            const hint = document.getElementById('folderPathHint');
            if (currentPath) {
                hint.textContent = `Se creará en: ${currentPath}/`;
            } else {
                hint.textContent = 'Se creará en la raíz del bucket';
            }
            
            document.getElementById('createFolderSection').style.display = 'block';
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('contentsSection').style.display = 'none';
            currentFolder = null;
        }

        function showUploadForm(folderName) {
            currentFolder = folderName;
            document.getElementById('uploadFolderName').textContent = folderName;
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('createFolderSection').style.display = 'none';
            document.getElementById('contentsSection').style.display = 'none';
        }

        function showFolderContents(folderName) {
            currentFolder = folderName;
            document.getElementById('currentFolderName').textContent = folderName;
            document.getElementById('contentsSection').style.display = 'block';
            document.getElementById('createFolderSection').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'none';
            loadFolderContents(folderName);
        }

        function hideForms() {
            document.getElementById('createFolderSection').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('contentsSection').style.display = 'block';
        }

        // ============ CREATE FOLDER ============
        document.getElementById('createFolderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const folderName = document.getElementById('folderName').value;
            const successEl = document.getElementById('folderSuccess');

            try {
                const response = await fetch(`${API_BASE}/admin/create-folder`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': authToken,
                    },
                    body: JSON.stringify({ 
                        folderName,
                        parentPath: currentPath // Include current path for subfolder creation
                    }),
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                const displayPath = currentPath ? `${currentPath}/${data.folderName}` : data.folderName;
                successEl.textContent = `✓ Carpeta "${displayPath}" creada exitosamente`;
                successEl.classList.add('show');
                document.getElementById('folderName').value = '';
                setTimeout(() => {
                    successEl.classList.remove('show');
                    hideForms();
                    loadFolders();
                }, 1500);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // ============ UPLOAD FILE ============
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('fileInput').files[0];
            const successEl = document.getElementById('uploadSuccess');

            if (!currentFolder) {
                alert('Selecciona una carpeta');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('folder', currentFolder);

                const response = await fetch(`${API_BASE}/admin/upload`, {
                    method: 'POST',
                    headers: {
                        'x-admin-token': authToken,
                    },
                    body: formData,
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                successEl.textContent = `✓ Archivo "${file.name}" subido exitosamente`;
                successEl.classList.add('show');
                document.getElementById('fileInput').value = '';
                setTimeout(() => {
                    successEl.classList.remove('show');
                    loadFolderContents(currentFolder);
                }, 1500);
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // ============ LOAD FOLDERS ============
        async function loadFolders() {
            try {
                const url = currentPath 
                    ? `${API_BASE}/admin/folders?prefix=${encodeURIComponent(currentPath)}`
                    : `${API_BASE}/admin/folders`;
                    
                const response = await fetch(url, {
                    headers: { 'x-admin-token': authToken },
                });

                const folders = await response.json();
                const foldersList = document.getElementById('foldersList');
                foldersList.innerHTML = '';

                // Update breadcrumb and back button
                updateBreadcrumb();

                if (folders.length === 0) {
                    foldersList.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No hay carpetas</div>';
                    return;
                }

                folders.forEach(folder => {
                    const div = document.createElement('div');
                    div.className = 'folder-item';
                    div.onclick = () => navigateToFolder(folder.fullPath);
                    div.innerHTML = `
                        <span>📁 ${folder.name}</span>
                        <button type="button" class="btn-delete" onclick="event.stopPropagation(); deleteFolder('${folder.fullPath}')">🗑️</button>
                    `;
                    foldersList.appendChild(div);
                });
            } catch (err) {
                console.error('Error loading folders:', err);
            }
        }

        // ============ NAVIGATION FUNCTIONS ============
        function navigateToFolder(folderPath) {
            currentPath = folderPath;
            loadFolders();
            showFolderContents(folderPath);
        }

        function navigateToPath(path) {
            currentPath = path;
            loadFolders();
            if (path) {
                showFolderContents(path);
            } else {
                document.getElementById('folderContents').innerHTML = 
                    '<div class="no-content">Selecciona una carpeta para ver su contenido</div>';
                document.getElementById('contentsSection').style.display = 'block';
            }
        }

        function navigateBack() {
            if (!currentPath) return;
            
            const pathParts = currentPath.split('/').filter(p => p);
            pathParts.pop(); // Remove last part
            currentPath = pathParts.join('/');
            loadFolders();
            
            if (currentPath) {
                showFolderContents(currentPath);
            }
        }

        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            const backButton = document.getElementById('backButton');
            
            if (!currentPath) {
                breadcrumb.style.display = 'none';
                backButton.style.display = 'none';
                return;
            }

            breadcrumb.style.display = 'block';
            backButton.style.display = 'block';

            const parts = currentPath.split('/').filter(p => p);
            let html = '<span style="color: #667eea; cursor: pointer;" onclick="navigateToPath(\'\')">🏠 Inicio</span>';
            
            let accumulatedPath = '';
            parts.forEach((part, index) => {
                accumulatedPath += (accumulatedPath ? '/' : '') + part;
                const path = accumulatedPath;
                html += ` <span style="color: #999;">›</span> `;
                if (index === parts.length - 1) {
                    html += `<span style="color: #333; font-weight: 600;">${part}</span>`;
                } else {
                    html += `<span style="color: #667eea; cursor: pointer;" onclick="navigateToPath('${path}')">${part}</span>`;
                }
            });

            breadcrumb.innerHTML = html;
        }

        // ============ LOAD FOLDER CONTENTS ============
        async function loadFolderContents(prefix) {
            try {
                const response = await fetch(`${API_BASE}/admin/folder-contents?prefix=${encodeURIComponent(prefix + '/')}`, {
                    headers: { 'x-admin-token': authToken },
                });

                const data = await response.json();
                const contentsDiv = document.getElementById('folderContents');

                if (!data || (data.subfolders.length === 0 && data.files.length === 0)) {
                    contentsDiv.innerHTML = `
                        <div class="no-content">
                            Esta carpeta está vacía
                            <div class="action-buttons" style="margin-top: 20px;">
                                <button onclick="showUploadForm('${prefix}')">📤 Subir archivo</button>
                                <button onclick="currentPath='${prefix}'; loadFolders(); showCreateFolderForm();">📁 Crear subcarpeta</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <div class="action-buttons">
                        <button onclick="showUploadForm('${prefix}')">📤 Subir archivo</button>
                        <button onclick="currentPath='${prefix}'; loadFolders(); showCreateFolderForm();">📁 Crear subcarpeta</button>
                    </div>
                `;

                // Show subfolders first
                if (data.subfolders.length > 0) {
                    html += `
                        <h3 style="margin: 20px 0 10px 0; color: #667eea; font-size: 16px;">
                            📁 Subcarpetas (${data.subfolders.length})
                        </h3>
                        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px;">
                    `;
                    
                    data.subfolders.forEach(subfolder => {
                        html += `
                            <div style="
                                padding: 15px;
                                background: linear-gradient(135deg, #f0f4ff 0%, #e8ebff 100%);
                                border-radius: 10px;
                                border: 2px solid rgba(102, 126, 234, 0.2);
                                cursor: pointer;
                                transition: all 0.3s ease;
                                display: flex;
                                align-items: center;
                                justify-content: space-between;
                            " 
                            onclick="navigateToFolder('${subfolder.fullPath}')"
                            onmouseover="this.style.transform='scale(1.02)'; this.style.borderColor='rgba(102, 126, 234, 0.5)';"
                            onmouseout="this.style.transform='scale(1)'; this.style.borderColor='rgba(102, 126, 234, 0.2)';">
                                <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
                                    <span style="font-size: 24px;">📁</span>
                                    <span style="font-weight: 600; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                        ${subfolder.name}
                                    </span>
                                </div>
                                <button 
                                    type="button" 
                                    class="btn-delete" 
                                    onclick="event.stopPropagation(); deleteFolder('${subfolder.fullPath}')"
                                    style="padding: 4px 8px !important; font-size: 11px !important; margin-left: 5px;">
                                    🗑️
                                </button>
                            </div>
                        `;
                    });
                    
                    html += `</div>`;
                }

                // Show files as cards
                if (data.files.length > 0) {
                    html += `
                        <h3 style="margin: 20px 0 10px 0; color: #667eea; font-size: 16px;">
                            📄 Archivos (${data.files.length})
                        </h3>
                        <div class="media-grid">
                    `;

                    data.files.forEach(file => {
                        const fileName = file.name;
                        const ext = fileName.split('.').pop().toLowerCase();
                        const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                        const isVideo = ['mp4', 'webm', 'avi', 'mov'].includes(ext);
                        const fileSize = formatFileSize(file.size);
                        const fileKey = file.key.replace(/'/g, "\\'");
                        const fileUrl = file.url || '';

                        let thumbnail = '';
                        let type = '';

                        if (isImage) {
                            type = '🖼️ Imagen';
                            // Generate unique ID for error handling
                            const imgId = 'img_' + Math.random().toString(36).substr(2, 9);
                            thumbnail = `
                                <img id="${imgId}" src="${fileUrl}" alt="${fileName}" style="width: 100%; height: 100%; object-fit: cover;" 
                                onerror="document.getElementById('${imgId}').style.display='none'; document.getElementById('${imgId}_fallback').style.display='flex';">
                                <div id="${imgId}_fallback" style="width: 100%; height: 100%; display: none; align-items: center; justify-content: center; font-size: 48px;">🖼️</div>
                            `;
                        } else if (isVideo) {
                            type = '🎥 Video';
                            thumbnail = `<video style="width: 100%; height: 100%; object-fit: cover;" muted><source src="${fileUrl}" type="video/${ext}"></video>`;
                        } else {
                            type = '📎 Archivo';
                            thumbnail = `<span style="font-size: 48px;">📎</span>`;
                        }

                        html += `
                            <div class="media-card">
                                <div class="media-card-thumbnail ${!isImage && !isVideo ? 'video-placeholder' : ''}">
                                    ${thumbnail}
                                </div>
                                <div class="media-card-info">
                                    <div class="media-card-name" title="${fileName}">${fileName}</div>
                                    <div class="media-card-size">${fileSize}</div>
                                    <span class="media-card-type">${type}</span>
                                    <div class="media-card-actions">
                                        <button type="button" class="media-card-btn media-card-delete" onclick="deleteFile('${fileKey}')">🗑️ Eliminar</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                }

                html += `
                    <p style="margin-top: 15px; color: #666; font-size: 12px;">
                        Total: ${data.subfolders.length} subcarpeta(s), ${data.files.length} archivo(s)
                    </p>
                `;

                contentsDiv.innerHTML = html;
            } catch (err) {
                console.error('Error loading folder contents:', err);
                document.getElementById('folderContents').innerHTML = 
                    '<div class="no-content">Error cargando contenido</div>';
            }
        }

        // ============ DELETE FILE ============
        async function deleteFile(fileKey) {
            if (!confirm('¿Estás seguro de que deseas borrar este archivo?')) return;

            try {
                const response = await fetch(`${API_BASE}/admin/file?key=${encodeURIComponent(fileKey)}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': authToken },
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                alert('Archivo borrado exitosamente');
                
                // Reload current folder contents
                if (currentFolder) {
                    loadFolderContents(currentFolder);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // ============ DELETE FOLDER ============
        async function deleteFolder(folderName) {
            if (!confirm(`¿Estás seguro de que deseas borrar la carpeta "${folderName}" y todo su contenido?`)) return;

            try {
                const response = await fetch(`${API_BASE}/admin/folder?prefix=${encodeURIComponent(folderName)}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': authToken },
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                alert(`Carpeta borrada exitosamente (${data.filesDeleted} archivo(s) eliminado(s))`);
                
                // Check if deleted folder is in current path
                if (currentFolder === folderName) {
                    currentFolder = null;
                    document.getElementById('folderContents').innerHTML = 
                        '<div class="no-content">Selecciona una carpeta para ver su contenido</div>';
                }
                
                // Reload current folder view
                loadFolders();
                
                // If viewing contents of current path, reload
                if (currentPath) {
                    showFolderContents(currentPath);
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        // ============ UTILITY FUNCTIONS ============
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function showAdminPanel() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminContainer').classList.add('show');
        }
    </script>
</body>
</html>
