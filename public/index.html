<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Publicidad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #mediaContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #currentMedia {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="mediaContainer">
        <img id="currentMedia" src="" alt="Media content">
    </div>

    <script>
        const imageExtensions = ['jpg', 'jpeg', 'png', 'gif'];
        const videoExtensions = ['mp4', 'webm'];
        let mediaFiles = [];
        let currentIndex = 0;
        let mediaElement = document.getElementById('currentMedia');
        const container = document.getElementById('mediaContainer');

        // Función para cargar la lista de archivos
        async function loadMediaFiles() {
            try {
                const response = await fetch('/api/media-files');
                mediaFiles = await response.json();
                if (mediaFiles.length > 0) {
                    showNext();
                }
            } catch (error) {
                console.error('Error cargando archivos:', error);
            }
        }

        // Función para mostrar el siguiente medio
        function showNext() {
            if (mediaFiles.length === 0) return;

                const file = mediaFiles[currentIndex];
                const extension = file.split('.').pop().toLowerCase();

                // Limpiamos el contenedor
                container.innerHTML = '';

                // Si el elemento es una URL absoluta (http/https), la usamos tal cual.
                const src = /^https?:\/\//i.test(file) ? file : `/media/${file}`;

                if (videoExtensions.includes(extension)) {
                    // Es un video
                    const video = document.createElement('video');
                    video.id = 'currentMedia';
                    video.src = src;
                    video.autoplay = true;
                    video.muted = true; // Necesario para autoplay en algunos navegadores
                    video.playsInline = true;

                    video.onended = () => {
                        currentIndex = (currentIndex + 1) % mediaFiles.length;
                        showNext();
                    };

                    container.appendChild(video);
                } else if (imageExtensions.includes(extension)) {
                    // Es una imagen
                    const img = document.createElement('img');
                    img.id = 'currentMedia';
                    img.src = src;
                    img.alt = 'Media content';
                    container.appendChild(img);

                    // Cambiar después de 10 segundos
                    setTimeout(() => {
                        currentIndex = (currentIndex + 1) % mediaFiles.length;
                        showNext();
                    }, 10000);
                }
        }

        // Cargar archivos inicialmente
        loadMediaFiles();

        // Recargar la lista cada 5 minutos para detectar nuevos archivos
        setInterval(loadMediaFiles, 300000);
    </script>
</body>
</html>
