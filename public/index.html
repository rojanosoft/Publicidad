<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base id="basePathTag" href="/">
    <title>Sistema de Publicidad</title>
    <script>window.BASE_PATH = window.BASE_PATH || '/';</script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <button id="fullscreenBtn">⛶ Fullscreen</button>

    <div id="sidebar">
        <h3 style="margin-top:0">📁 Carpetas</h3>
        
        <!-- Breadcrumb Navigation -->
        <div id="breadcrumb" style="display: none; padding: 8px; background: #444; border-radius: 4px; margin-bottom: 10px; font-size: 12px; overflow-x: auto; white-space: nowrap;">
            <span style="color: #667eea; cursor: pointer;" onclick="navigateToPath('')">🏠 Inicio</span>
        </div>
        
        <!-- Back Button -->
        <button id="backButton" onclick="navigateBack()" style="display: none; width: 100%; margin-bottom: 10px; padding: 8px; font-size: 13px; background: #555; color: white; border: none; border-radius: 4px; cursor: pointer;">
            ⬅️ Volver
        </button>
        
        <div id="currentFolderInfo" style="padding: 10px; background: #444; border-radius: 4px; margin-bottom: 10px; color: #aaa; font-size: 12px;">
            Actual: <span id="currentFolderName" style="color: #fff; font-weight: bold;">cargando...</span>
        </div>
        
        <div style="padding: 8px; background: rgba(102, 126, 234, 0.1); border-radius: 4px; margin-bottom: 10px; font-size: 11px; color: #aaa; line-height: 1.4;">
            💡 <strong style="color: #667eea;">Tip:</strong> Doble clic para entrar a subcarpetas
        </div>
        
        <div id="folders">Cargando...</div>
        <hr style="border-color:#222">
        <button id="refreshFolders">🔄 Refrescar</button>
    </div>

    <div id="mediaContainer">
        <!-- Media will be inserted here dynamically -->
    </div>

    <script>
        // BASE_PATH is injected by server, or fallback to base tag
        if (typeof window.BASE_PATH === 'undefined') {
            window.BASE_PATH = document.querySelector('base')?.getAttribute('href') || '/';
        }
        if (!window.BASE_PATH.endsWith('/')) {
            window.BASE_PATH += '/';
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
