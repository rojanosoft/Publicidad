# Nginx Configuration for Publicidad in Subdirectory
# Save as: /etc/nginx/sites-available/dominio.com

server {
    listen 80;
    server_name dominio.com www.dominio.com;

    # Large file uploads - MUST be inside server block!
    client_max_body_size 5G;

    # Optional: Redirect HTTP to HTTPS
    # return 301 https://$server_name$request_uri;

    # Root service (if you have one)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Publicidad Display System
    # IMPORTANT: No trailing slash on proxy_pass!
    location /publicidad {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for large file uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
    }
    
    # Timeouts
    client_body_timeout 600s;
    client_header_timeout 600s;
    
    # Logging
    access_log /var/log/nginx/dominio.com.access.log;
    error_log /var/log/nginx/dominio.com.error.log;
}

# HTTPS Configuration (if using SSL)
server {
    listen 443 ssl http2;
    server_name dominio.com www.dominio.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominio.com/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root service
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Publicidad Display System
    location /publicidad {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts for large file uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
    }

    # Large file uploads - applies to entire server block
    client_max_body_size 5G;
    
    # Timeouts
    client_body_timeout 600s;
    client_header_timeout 600s;
    
    access_log /var/log/nginx/dominio.com.ssl.access.log;
    error_log /var/log/nginx/dominio.com.ssl.error.log;
}
